<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear & Radial Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Floating Animations -->
    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .pill-float-1 {
        animation: pulsePill 5s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: pulsePill2 6s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: pulseRing 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .dash-flow {
        stroke-dasharray: 6 8;
        animation: dashMove 20s linear infinite;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
        100% { transform: translate(-30px, 50px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-50px, -40px) scale(1.1); }
        100% { transform: translate(40px, -20px) scale(0.9); }
      }
      @keyframes pulsePill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      @keyframes pulsePill2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs in the background -->
  <g class="orb-1">
    <circle cx="240" cy="140" r="280" fill="url(#glowViolet)" />
  </g>
  <g class="orb-2">
    <circle cx="960" cy="260" r="260" fill="url(#glowCyan)" />
  </g>
  <circle cx="600" cy="80" r="200" fill="url(#glowPink)" />

  <!-- Tech Grid Texture -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Network / Flow Lines behind the text -->
  <g class="dash-flow" opacity="0.45">
    <path d="M 50 100 Q 300 20 600 90 T 1150 110" fill="none" stroke="#6366f1" stroke-width="1.8" />
    <path d="M 50 330 Q 350 400 650 320 T 1150 330" fill="none" stroke="#06b6d4" stroke-width="1.8" />
    <path d="M 120 40 Q 600 260 1080 50" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Ambient Pulsing Geometric Accents -->
  <g opacity="0.5" transform="translate(110, 80)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-ring" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>
  <g opacity="0.5" transform="translate(1090, 320)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" class="pulse-ring" />
    <circle cx="0" cy="0" r="5" fill="#a855f7" />
  </g>

  <!-- Outer Card Border -->
  <rect x="2" y="2" width="1196" height="416" rx="20" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 72)">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.4" opacity="0.9" />
    <circle cx="-168" cy="0" r="5" fill="#22c55e" />
    <text x="-150" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">
      CURATED ECOSYSTEM DIRECTORY
    </text>
  </g>

  <!-- Main Title (Strictly Foregrounded & High Contrast) -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
    AI Prompt Templates &amp; Developer Boilerplates
  </text>

  <!-- Subtitle (Clear Foreground readability) -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="url(#subGrad)" letter-spacing="0.3">
    Coding Agent Rules (CLAUDE.md &bull; .cursorrules) &bull; RAG &amp; Agent Starters &bull; Prompt CMS &bull; DSPy &bull; Evaluators
  </text>

  <!-- Dynamic Feature Badges / Pills (Placed safely below subtitle) -->
  <g class="pill-float-1" transform="translate(115, 240)">
    <!-- Pill 1: CLAUDE.md & CursorRules -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="46" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
      <rect x="12" y="13" width="20" height="20" rx="6" fill="#6366f1" opacity="0.25" />
      <text x="22" y="27" font-family="monospace" font-size="13" font-weight="700" fill="#818cf8">#</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Agent Instruction Rules</text>
      <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">CLAUDE.md &bull; .cursorrules</text>
    </g>

    <!-- Pill 2: Full-Stack Boilerplates -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="225" height="46" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
      <rect x="12" y="13" width="20" height="20" rx="6" fill="#06b6d4" opacity="0.25" />
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#22d3ee">&lt;/&gt;</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Full-Stack Starter Kits</text>
      <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Next.js &bull; FastAPI &bull; Open SaaS</text>
    </g>

    <!-- Pill 3: DSPy & Compilers -->
    <g transform="translate(505, 0)">
      <rect x="0" y="0" width="220" height="46" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
      <rect x="12" y="13" width="20" height="20" rx="6" fill="#a855f7" opacity="0.25" />
      <text x="17" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c084fc">&lambda;</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Prompt Compilers</text>
      <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">DSPy &bull; MIPROv2 &bull; BAML</text>
    </g>

    <!-- Pill 4: LLMOps & Observability -->
    <g transform="translate(755, 0)">
      <rect x="0" y="0" width="215" height="46" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
      <rect x="12" y="13" width="20" height="20" rx="6" fill="#10b981" opacity="0.25" />
      <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#34d399">&check;</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Prompt CMS &amp; Evals</text>
      <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Langfuse &bull; Promptfoo &bull; Agenta</text>
    </g>
  </g>

  <!-- Lower Stats / Metrics Bar -->
  <g class="pill-float-2" transform="translate(250, 320)">
    <rect x="0" y="0" width="700" height="42" rx="21" fill="#0b1120" stroke="#334155" stroke-width="1" opacity="0.9" />
    
    <g transform="translate(80, 26)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#38bdf8">35+ </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Tracked Projects</text>
    </g>

    <line x1="240" y1="10" x2="240" y2="32" stroke="#334155" stroke-width="1" />

    <g transform="translate(300, 26)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#a855f7">100% </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Free / Open-Source Ready</text>
    </g>

    <line x1="495" y1="10" x2="495" y2="32" stroke="#334155" stroke-width="1" />

    <g transform="translate(545, 26)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#22c55e">Ranked </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">By Live Stars &amp; Scale</text>
    </g>
  </g>
</svg>
